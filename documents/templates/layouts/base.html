<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SITAMPAN Document Sync{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
            padding-bottom: 70px; /* Space for mobile nav */
        }
        @media (min-width: 768px) {
            body { padding-bottom: 0; }
            .mobile-nav { display: none !important; }
        }
        .navbar {
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 25px 0;
            z-index: 1030;
        }
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #6c757d;
            font-size: 10px;
            font-weight: 600;
        }
        .mobile-nav-item.active {
            color: var(--bs-primary);
        }
        .mobile-nav-item .material-symbols-outlined {
            font-size: 24px;
            margin-bottom: 2px;
        }
        .add-btn-mobile {
            width: 50px;
            height: 50px;
            background: var(--bs-primary);
            color: white !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -25px;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'documents:dashboard' %}">
                <i class="bi bi-folder-symlink"></i> SITAMPAN
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'documents:dashboard' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'documents:document_list' %}">Archives</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'documents:document_upload' %}">Upload</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'documents:category_list' %}">Categories</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <nav class="mobile-nav d-md-none">
        <a href="{% url 'documents:dashboard' %}" class="mobile-nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <span class="material-symbols-outlined">grid_view</span>
            <span>Home</span>
        </a>
        <a href="{% url 'documents:document_list' %}" class="mobile-nav-item {% if request.resolver_match.url_name == 'document_list' %}active{% endif %}">
            <span class="material-symbols-outlined">folder</span>
            <span>Archives</span>
        </a>
        <a href="{% url 'documents:document_upload' %}" class="mobile-nav-item add-btn-mobile">
            <span class="material-symbols-outlined">add</span>
        </a>
        <a href="{% url 'documents:category_list' %}" class="mobile-nav-item {% if 'category' in request.resolver_match.url_name %}active{% endif %}">
            <span class="material-symbols-outlined">category</span>
            <span>Categories</span>
        </a>
        <a href="#" class="mobile-nav-item" onclick="alert('Profile section coming soon!')">
            <span class="material-symbols-outlined">person</span>
            <span>Profile</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
