{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SITAMPAN - Keluar</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary-container": "#2d63ed",
                "tertiary": "#953800",
                "surface-variant": "#e1e3e4",
                "on-tertiary-container": "#ffefe9",
                "on-primary-fixed": "#00164d",
                "on-tertiary": "#ffffff",
                "primary-fixed-dim": "#b5c4ff",
                "surface-container": "#edeeef",
                "inverse-surface": "#2e3132",
                "inverse-on-surface": "#f0f1f2",
                "background": "#f8f9fa",
                "on-surface": "#191c1d",
                "on-tertiary-fixed-variant": "#7d2d00",
                "tertiary-container": "#bd4900",
                "on-surface-variant": "#434655",
                "inverse-primary": "#b5c4ff",
                "surface-container-high": "#e7e8e9",
                "primary-fixed": "#dce1ff",
                "surface-bright": "#f8f9fa",
                "surface-dim": "#d9dadb",
                "error-container": "#ffdad6",
                "secondary": "#4a5c95",
                "surface-container-highest": "#e1e3e4",
                "error": "#ba1a1a",
                "surface-container-lowest": "#ffffff",
                "secondary-fixed": "#dce1ff",
                "primary": "#0049ce",
                "secondary-container": "#adbfff",
                "on-error": "#ffffff",
                "on-secondary": "#ffffff",
                "surface": "#f8f9fa",
                "on-error-container": "#93000a",
                "on-primary": "#ffffff",
                "secondary-fixed-dim": "#b5c4ff",
                "on-secondary-fixed": "#00164d",
                "on-tertiary-fixed": "#360f00",
                "on-secondary-container": "#3a4c85",
                "outline-variant": "#c3c5d7",
                "on-primary-container": "#f0f1ff",
                "surface-tint": "#0e52dc",
                "on-background": "#191c1d",
                "on-secondary-fixed-variant": "#32447c",
                "tertiary-fixed": "#ffdbcd",
                "surface-container-low": "#f3f4f5",
                "tertiary-fixed-dim": "#ffb596",
                "on-primary-fixed-variant": "#003cad",
                "outline": "#737686"
              },
              fontFamily: {
                "headline": ["Manrope"],
                "body": ["Inter"],
                "label": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
            },
          },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .cloud-shadow {
            box-shadow: 0 8px 24px 0 rgba(25, 28, 29, 0.04);
        }
        .primary-gradient {
            background: linear-gradient(180deg, #2D63ED 0%, #0049CE 100%);
        }
        .inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col">

    <!-- TopAppBar -->
    <header class="h-16 flex items-center px-6 bg-surface-bright/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-3 w-full max-w-7xl mx-auto">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/KPU_Logo.svg" alt="KPU Logo" class="h-8 w-auto">
            <h1 class="font-headline text-lg font-semibold text-on-surface tracking-tight">SITAMPAN Document Sync</h1>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-24">
        <div class="w-full max-w-md">
            
            <!-- Branding/Identity Section -->
            <div class="text-center mb-12">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-white mb-6 cloud-shadow border border-outline-variant/15 p-3 mx-auto">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/KPU_Logo.svg" alt="KPU Logo" class="w-full h-full object-contain">
                </div>
                <h2 class="font-headline text-[2.75rem] leading-tight font-bold text-on-surface mb-2">Konfirmasi Keluar</h2>
                <p class="text-on-surface-variant font-body">Apakah Anda yakin ingin keluar dari SITAMPAN?</p>
            </div>

            <!-- Sign Out Card -->
            <div class="bg-surface-container-lowest p-10 rounded-3xl cloud-shadow border border-outline-variant/15">
                <form method="POST" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                    {% endif %}

                    <div class="space-y-4">
                        <button class="w-full primary-gradient text-on-primary font-semibold py-4 rounded-3xl inner-glow hover:opacity-90 transition-all flex items-center justify-center gap-2" type="submit">
                            <span>Ya, Keluar</span>
                            <span class="material-symbols-outlined text-[20px]">logout</span>
                        </button>
                        
                        <a href="{% url 'documents:dashboard' %}" class="w-full bg-surface-container-low text-on-surface-variant font-semibold py-4 rounded-3xl hover:bg-surface-container-high transition-all flex items-center justify-center gap-2">
                            <span>Batal</span>
                        </a>
                    </div>
                </form>
            </div>
            
            <p class="text-center mt-10 text-on-surface-variant font-body text-sm">
                Terima kasih telah menggunakan SITAMPAN. Sesi Anda akan diakhiri dengan aman.
            </p>
        </div>
    </main>

    <!-- Visual Background Element -->
    <div class="fixed top-0 right-0 -z-10 w-1/3 h-full overflow-hidden opacity-50 pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-primary-container/5 blur-[120px]"></div>
        <div class="absolute bottom-[20%] right-[-5%] w-[400px] h-[400px] rounded-full bg-tertiary-container/5 blur-[100px]"></div>
    </div>

</body>
</html>
